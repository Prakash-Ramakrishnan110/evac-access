version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: evacaccess_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: evacaccess_india
      POSTGRES_USER: evacadmin
      POSTGRES_PASSWORD: evacsecurepassword123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evacadmin -d evacaccess_india"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: evacaccess_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
